name: Windows build and acceptance
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows x64 build
        shell: pwsh
        run: dotnet publish -c Release -r win-x64 --self-contained -p:Version=1.0.0-rc.1 -o "$env:RUNNER_TEMP/wtrail-package"
      - name: Install ripgrep for the benchmark
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/ripgrep.zip"
          Invoke-WebRequest -Uri 'https://github.com/BurntSushi/ripgrep/releases/download/16.0.0/ripgrep-16.0.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'f418ae83e63046a94a7b5f3a44bf3a169f66e689164856ecee02547131c73931') {
            throw 'Ripgrep checksum mismatch.'
          }
          Expand-Archive $archive "$env:RUNNER_TEMP/ripgrep"
          (Get-ChildItem "$env:RUNNER_TEMP/ripgrep" -Recurse -Filter rg.exe | Select-Object -First 1).Directory.FullName |
            Out-File $env:GITHUB_PATH -Append
      - name: Run Windows acceptance
        shell: pwsh
        run: ./scripts/Test-Windows.ps1 -Executable "$env:RUNNER_TEMP/wtrail-package/wtrail.exe" -Benchmark
      - name: Test Windows Ctrl+C and JSONL
        shell: pwsh
        run: python ./scripts/Test-WindowsCancel.py "$env:RUNNER_TEMP/wtrail-package/wtrail.exe"
      - name: Package verified build
        shell: pwsh
        run: |
          Copy-Item README.md "$env:RUNNER_TEMP/wtrail-package/"
          Compress-Archive "$env:RUNNER_TEMP/wtrail-package/*" wtrail-1.0.0-rc.1-win-x64.zip
          $zip = Get-Item wtrail-1.0.0-rc.1-win-x64.zip
          "$((Get-FileHash $zip).Hash.ToLowerInvariant())  $($zip.Name)" | Set-Content -Encoding ascii "$($zip.Name).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wtrail-1.0.0-rc.1-win-x64
          path: |
            wtrail-1.0.0-rc.1-win-x64.zip
            wtrail-1.0.0-rc.1-win-x64.zip.sha256
